# fly.toml â€” APS EDU Backend
# DocumentaÃ§Ã£o: https://fly.io/docs/reference/configuration/

app = "aps-edu-api"
primary_region = "gru"  # SÃ£o Paulo, Brasil

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  # As demais variÃ¡veis (DATABASE_URL, JWT_SECRET, etc.) devem ser configuradas
  # via: fly secrets set NOME=VALOR

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1


[deploy]
  release_command = "npx prisma migrate deploy"

[[statics]]
  guest_path = "/app/public"
  url_prefix = "/public"
