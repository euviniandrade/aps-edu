services:
  - type: web
    name: aps-whatsapp
    runtime: docker
    dockerfilePath: backend/Dockerfile.baileys
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: WHATSAPP_PORT
        value: "8081"
      - key: WHATSAPP_API_KEY
        value: aps-edu-whatsapp
      - key: WHATSAPP_DATA_DIR
        value: /data
      - key: GEMINI_API_KEY
        sync: false
