name: Caixa Vini -> testes e deploy (Fly.io)

on:
  push:
    branches:
      - main
    paths:
      - 'caixa-vini/**'
      - '.github/workflows/deploy-caixa-vini.yml'
  pull_request:
    paths:
      - 'caixa-vini/**'
      - '.github/workflows/deploy-caixa-vini.yml'
  workflow_dispatch:

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: caixa-vini
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: caixa-vini/package-lock.json
      - run: npm ci
      - run: npm test

  deploy:
    name: Deploy
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_CAIXA_VINI }}
    steps:
      - uses: actions/checkout@v4
      - name: Verificar token
        id: token
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "Segredo FLY_API_TOKEN_CAIXA_VINI não configurado; deploy ignorado (veja caixa-vini/README.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.ok == 'true'
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        working-directory: caixa-vini
        run: flyctl deploy --remote-only
