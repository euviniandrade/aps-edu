<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caixa Vini</title>
<meta name="description" content="Suas contas, gastos e metas sob controle, com assistente de IA e WhatsApp.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#000000">

<meta property="og:site_name" content="Caixa Vini">
<meta property="og:title" content="Caixa Vini">
<meta property="og:description" content="Seu dinheiro sob controle, até pelo WhatsApp.">
<meta property="og:image" content="https://caixa-vini.vercel.app/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://caixa-vini.vercel.app/">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Caixa Vini">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* Layout: app de banco digital, tema escuro único. Topo = saudação + SALDO EM CONTA gigante,
   depois atalhos redondos, assistente e cartões de conteúdo. Desktop: trilho lateral. */
:root{
  --bg:#000000; --surface:#121212; --surface-2:#1c1c1e; --surface-3:#2a2a2d;
  --ink:#ffffff; --muted:#a1a1aa; --line:#26262a;
  --accent:#a35cff; --accent-strong:#8a2be2; --accent-ink:#ffffff; --accent-soft:#2a1a40;
  --ok:#34d399; --ok-soft:#0f2e22; --warn:#fbbf24; --warn-soft:#33270b; --bad:#f87171; --bad-soft:#3a1517;
  --font-display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-body:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --r:20px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.02em;font-weight:700}
h1{font-size:22px} h2{font-size:17px} h3{font-size:15px}
.num,.amt,.val{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.app{display:grid;grid-template-columns:1fr;min-height:100%}

/* ---- topo ---- */
header.top{position:sticky;top:0;z-index:5;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:calc(12px + env(safe-area-inset-top)) 20px 10px;display:flex;align-items:center;gap:10px}
header.top .brand{flex:1;display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;min-width:0}
.brand .logo{width:36px;height:36px;border-radius:50%;background:var(--accent-strong);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:800;flex:0 0 auto}
.brand .ola{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.iconbtn svg{width:20px;height:20px}
.iconbtn:hover{background:var(--surface-3)}
.monthpick{display:flex;align-items:center;gap:0;background:var(--surface-2);border-radius:999px;padding:2px}
.monthpick button{border:0;background:transparent;width:30px;height:32px;border-radius:50%;cursor:pointer;font-size:16px;color:var(--muted)}
.monthpick span{min-width:76px;text-align:center;font-weight:700;font-size:13px;text-transform:capitalize}

main{padding:4px 20px calc(110px + env(safe-area-inset-bottom));max-width:1100px;width:100%;margin:0 auto;display:grid;gap:18px;align-content:start}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(18,18,18,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bottom a{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:600;border-radius:14px}
nav.bottom a svg{width:22px;height:22px}
nav.bottom a[aria-current="page"]{color:var(--ink)}
nav.bottom a[aria-current="page"] svg{color:var(--accent)}

/* ---- saldo ---- */
.saldo{display:grid;gap:6px;padding:10px 0 4px}
.saldo .lbl{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;font-weight:600;background:none;border:0;padding:0;cursor:pointer;width:max-content}
.saldo .lbl svg{width:16px;height:16px}
.saldo .big{font-size:44px;line-height:1.05;font-weight:800;letter-spacing:-.035em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.saldo .big small{font-size:24px;font-weight:700;margin-right:6px;letter-spacing:-.01em}
.saldo .big .cent{font-size:.6em;color:var(--muted)}
.saldo .sub{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.saldo .sub b{color:var(--ink);font-variant-numeric:tabular-nums}
.saldo .sub b.pos{color:var(--ok)} .saldo .sub b.neg{color:var(--bad)}
.saldo-vazio{background:var(--accent-soft);border-radius:16px;padding:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ---- atalhos redondos ---- */
.atalhos{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none;margin:0 -20px;padding-left:20px;padding-right:20px}
.atalhos::-webkit-scrollbar{display:none}
.atalho{flex:0 0 auto;display:grid;justify-items:center;gap:8px;width:72px;border:0;background:none;cursor:pointer;text-decoration:none;color:var(--ink);font-size:12.5px;font-weight:600;text-align:center;line-height:1.2}
.atalho i{width:64px;height:64px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center}
.atalho i svg{width:24px;height:24px}
.atalho:hover i{background:var(--surface-3)}

/* ---- cartões de conteúdo ---- */
.card{background:var(--surface);border-radius:var(--r);padding:18px;display:grid;gap:12px;min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card-h a,.lnk{color:var(--accent);font-weight:700;font-size:14px;text-decoration:none;background:none;border:0;cursor:pointer;padding:0}
.eyebrow{font-size:13px;font-weight:700;color:var(--muted)}
.grid2{display:grid;gap:18px;grid-template-columns:1fr}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{background:var(--surface-2);border-radius:16px;padding:14px;display:grid;gap:2px;min-width:0}
.tile .lbl{font-size:12.5px;color:var(--muted);font-weight:600}
.tile .val{font-size:20px;font-weight:800;overflow-wrap:anywhere;letter-spacing:-.02em}
.resumo-mes{display:grid;gap:4px}
.resumo-mes .v{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}

/* ---- assistente ---- */
.composer{background:var(--surface-2);border-radius:18px;padding:5px 5px 5px 16px;display:flex;align-items:flex-end;gap:6px;border:1px solid transparent}
.composer:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;outline:none;font-size:16px;line-height:1.35;padding:10px 0;max-height:120px;min-height:42px}
.composer textarea::placeholder{color:var(--muted)}
.composer .send{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent-strong);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.composer .send svg{width:20px;height:20px}
.ai-hint{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.ai-hint::-webkit-scrollbar{display:none}
.ai-hint button{flex:0 0 auto;border:0;background:var(--surface-2);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--ink);cursor:pointer}
.ai-hint button:hover{background:var(--surface-3)}
.ai-out{display:grid;gap:10px}
.ai-msg{border-radius:18px;padding:12px 14px;background:var(--surface-2);display:grid;gap:10px;font-size:14.5px;white-space:pre-wrap}
.ai-msg .who{font-size:12px;font-weight:700;color:var(--accent)}
.ai-msg.user{background:var(--accent-strong);color:#fff;justify-self:end;max-width:85%}
.ai-act{background:var(--surface-3);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;white-space:normal}
.ai-act .k{font-size:11.5px;font-weight:700}
.ai-act .k.despesa{color:var(--bad)} .ai-act .k.receita{color:var(--ok)} .ai-act .k.conta{color:var(--warn)} .ai-act .k.pagar{color:var(--accent)}
.ai-act .d{font-weight:700} .ai-act .m{font-size:12.5px;color:var(--muted)}
.ai-act .v{font-weight:800;grid-row:1/span 3;grid-column:2;font-size:15px;font-variant-numeric:tabular-nums}
.thinking{display:inline-flex;gap:4px;align-items:center}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:blink 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}

/* ---- listas ---- */
.list{display:grid;gap:0}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .stripe{width:40px;height:40px;border-radius:50%;background:var(--surface-2);display:block;position:relative}
.row .stripe::after{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--muted)}
.row.s-vencida .stripe::after{background:var(--bad)} .row.s-hoje .stripe::after,.row.s-breve .stripe::after{background:var(--warn)} .row.s-paga .stripe::after{background:var(--ok)} .row.s-futura .stripe::after{background:var(--accent)}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .meta{font-size:12.5px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.row .r{text-align:right;display:grid;gap:4px;justify-items:end}
.row .amt{font-weight:800;white-space:nowrap;font-size:15px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-3);color:var(--muted);white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--surface-2);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;font-size:14px;min-height:42px;color:var(--ink);text-decoration:none}
.btn:hover{background:var(--surface-3)}
.btn.pri,.btn.acc{background:var(--accent-strong);color:#fff}
.btn.pri:hover,.btn.acc:hover{filter:brightness(1.12)}
.btn.sm{padding:6px 13px;min-height:32px;font-size:13px}
.btn.okb{background:var(--ok-soft);color:var(--ok)}
.btn.danger{color:var(--bad)}
.btn.ghost{background:transparent}
.fab{display:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:0;background:var(--surface-2);border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#000}
.bar{height:6px;background:var(--surface-3);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok>i{background:var(--ok)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.banner{border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center;font-weight:500}
.banner.bad{background:var(--bad-soft);color:#fecaca} .banner.warn{background:var(--warn-soft);color:#fde68a} .banner.info{background:var(--accent-soft);color:#e9d5ff}
.banner b{color:#fff}
.banner .btn{margin-left:auto;flex:0 0 auto}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
.chartbox{position:relative;height:220px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.scroll-x{overflow-x:auto}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-size:11px;color:var(--muted);text-align:center;font-weight:700}
.cal .d{min-height:58px;border:0;border-radius:12px;padding:5px;font-size:12px;display:grid;align-content:start;gap:2px;background:var(--surface-2);cursor:pointer;text-align:left;color:var(--ink)}
.cal .d.out{opacity:.3}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal .d .dn{font-weight:800}
.cal .d .ds{font-size:10px;font-weight:700;overflow-wrap:anywhere}
.cal .d.has-bad .ds{color:var(--bad)} .cal .d.has-open .ds{color:var(--warn)} .cal .d.has-paid .ds{color:var(--ok)}
.ccard{border-radius:20px;padding:18px;color:#fff;display:grid;gap:6px;min-height:160px;position:relative;overflow:hidden}
.ccard .cn{font-weight:800;font-size:17px}
.ccard .cv{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ccard .cs{font-size:12.5px;opacity:.9}
dialog{border:0;border-radius:24px;padding:0;width:min(520px,calc(100% - 24px));background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.7)}
.dlg{padding:22px;display:grid;gap:12px;max-height:85vh;overflow:auto}
.form{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.form .full{grid-column:1/-1}
label.f{display:grid;gap:5px;font-size:12.5px;font-weight:700;color:var(--muted)}
label.f input,label.f select,label.f textarea{border:1px solid transparent;background:var(--surface-2);border-radius:14px;padding:12px;font-size:16px;font-weight:500;color:var(--ink);width:100%;min-width:0}
label.f input:focus,label.f select:focus,label.f textarea:focus{border-color:var(--accent);outline:none}
label.chk{display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));background:#fff;color:#000;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:20;max-width:90%}
.seg{display:inline-flex;background:var(--surface-2);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:700;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#000}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.kv b{font-variant-numeric:tabular-nums}
.research td:first-child{font-weight:700;white-space:nowrap}
.subnav{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.subnav a{flex:0 0 auto;text-decoration:none;color:var(--ink);background:var(--surface-2);padding:8px 14px;border-radius:999px;font-size:13px;font-weight:700}
.subnav a[aria-current="page"]{background:var(--ink);color:#000}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;flex:0 0 auto}
.status-dot.on{background:var(--ok)} .status-dot.off{background:var(--warn)}
.fade-in{animation:up .3s ease-out both}
@keyframes up{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:860px){
  .app{grid-template-columns:240px 1fr}
  nav.bottom{position:sticky;top:0;left:auto;right:auto;bottom:auto;height:100vh;grid-template-columns:1fr;align-content:start;border-top:0;border-right:1px solid var(--line);padding:24px 12px;gap:4px;grid-row:1/span 2;background:var(--bg)}
  nav.bottom a{flex-direction:row;gap:12px;font-size:15px;padding:12px 14px;justify-content:flex-start}
  nav.bottom a[aria-current="page"]{background:var(--surface-2)}
  header.top,main{grid-column:2}
  main{padding-bottom:40px}
  .grid2{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .saldo .big{font-size:60px}
  .atalhos{margin:0;padding-left:2px;padding-right:2px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true">CV</span><span class="ola">Olá, Vini</span> <span id="syncDot" class="status-dot" title="Status da sincronização"></span></div>
    <div class="monthpick" aria-label="Mês de referência">
      <button id="mPrev" aria-label="Mês anterior">‹</button>
      <span id="mLabel" class="num"></span>
      <button id="mNext" aria-label="Próximo mês">›</button>
    </div>
    <button class="iconbtn" id="olhoBtn" aria-label="Esconder valores"></button>
  </header>
  <nav class="bottom" id="nav">
    <a href="#inicio" data-r="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</a>
    <a href="#contas" data-r="contas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>Contas</a>
    <a href="#lancamentos" data-r="lancamentos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></svg>Extrato</a>
    <a href="#planejar" data-r="planejar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg>Planejar</a>
    <a href="#mais" data-r="mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Mais</a>
  </nav>
  <main><div id="topo" style="display:grid;gap:18px;min-width:0"></div><div id="aiDock"></div><div id="view" style="display:grid;gap:16px;min-width:0"></div></main>
</div>
<button class="fab" id="fab" aria-label="Adicionar">+</button>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script>
"use strict";
/* ===================== utilidades ===================== */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BRL = new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const brl = v => (typeof ui!=="undefined" && ui.ocultar) ? "R$ ••••" : BRL.format(Number(v)||0);
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2,"0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { if(!s) return null; const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const fmtD = s => { const d=parseD(s); return d? d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"}).replace(".","") : "—"; };
const fmtDfull = s => { const d=parseD(s); return d? d.toLocaleDateString("pt-BR") : "—"; };
const ym = s => s ? s.slice(0,7) : "";

/* ===================== servidor ===================== */
async function api(metodo, url, corpo){
  let r;
  try{ r = await fetch(url, {method:metodo, credentials:"same-origin", headers: corpo!==undefined?{"content-type":"application/json"}:{}, body: corpo!==undefined?JSON.stringify(corpo):undefined}); }
  catch(e){ throw new Error("Sem conexão com o servidor. Verifique a internet."); }
  if(r.status===401 && !url.endsWith("/login")){ mode="login"; render(); throw new Error("Faça login para continuar"); }
  const d = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error || "Erro no servidor. Tente de novo.");
  return d;
}
async function recarregar(){
  const e = await api("GET","/api/estado");
  COLS.forEach(c=>S[c]=Array.isArray(e[c])?e[c]:[]);
  S.config = Object.assign({ rendaMensal:0, orcamentos:{}, reserva:0 }, e.config||{});
  mode="servidor"; render();
}
async function salvar(col, obj){
  obj.atualizadoEm = new Date().toISOString();
  const arr=S[col]; const i=arr.findIndex(x=>x.id===obj.id);
  if(i<0 && !obj.criadoEm) obj.criadoEm = obj.atualizadoEm; if(i>=0) arr[i]=obj; else arr.push(obj); render();
  try{ await api("PUT", `/api/dados/${col}/${encodeURIComponent(obj.id)}`, obj); }
  catch(e){ toast(e.message); recarregar().catch(()=>{}); throw e; }
}
async function remover(col, id){
  S[col]=S[col].filter(x=>x.id!==id); render();
  try{ await api("DELETE", `/api/dados/${col}/${encodeURIComponent(id)}`); }
  catch(e){ toast(e.message); recarregar().catch(()=>{}); throw e; }
}
async function salvarConfig(patch){
  Object.assign(S.config, patch); render();
  try{ await api("PUT","/api/config", S.config); }catch(e){ toast(e.message); }
}

/* ===================== regras de negócio ===================== */
function statusConta(c){
  if(c.status==="paga") return {k:"paga", label:"Paga", cls:"ok"};
  const d=parseD(c.vencimento); const t=today(); const diff=daysBetween(t,d);
  if(diff<0) return {k:"vencida", label:`Vencida há ${-diff}d`, cls:"bad"};
  if(diff===0) return {k:"hoje", label:"Vence hoje", cls:"warn"};
  if(diff<=7) return {k:"breve", label:`Em ${diff}d`, cls:"warn"};
  return {k:"futura", label:`Em ${diff}d`, cls:"acc"};
}
const contasDoMes = k => S.contas.filter(c=>ym(c.vencimento)===k);
const contasAbertas = () => S.contas.filter(c=>c.status!=="paga");
const vencidas = () => contasAbertas().filter(c=>parseD(c.vencimento)<today());
const lancDoMes = k => S.lancamentos.filter(l=>ym(l.data)===k);
const soma = (arr, f="valor") => round2(arr.reduce((a,x)=>a+(Number(x[f])||0),0));

function resumoMes(k){
  const contas = contasDoMes(k);
  const abertasMes = contas.filter(c=>c.status!=="paga");
  const atrasadasAnteriores = contasAbertas().filter(c=>ym(c.vencimento)<k);
  const receitas = soma(lancDoMes(k).filter(l=>l.tipo==="receita"));
  const despesas = soma(lancDoMes(k).filter(l=>l.tipo==="despesa"));
  const aPagar = soma(abertasMes) + (k===iso(today()).slice(0,7) ? soma(atrasadasAnteriores) : 0);
  const pagoContas = soma(contas.filter(c=>c.status==="paga"), "valorPago");
  const renda = Math.max(receitas, Number(S.config.rendaMensal)||0);
  const metasMes = soma(S.metas, "aporteMensal");
  const livre = round2(renda - despesas - aPagar - metasMes);
  const totalContasMes = soma(contas) + (k===iso(today()).slice(0,7) ? soma(atrasadasAnteriores) : 0);
  return { contas, abertasMes, atrasadasAnteriores, receitas, despesas, aPagar, pagoContas, renda, livre, metasMes, totalContasMes };
}

function saude(){
  const k=iso(today()).slice(0,7), r=resumoMes(k);
  let score=100; const motivos=[];
  const v=vencidas(); if(v.length){ score-=Math.min(35, 15+v.length*5); motivos.push(`${v.length} conta(s) vencida(s)`); }
  const neg=S.cartoes.filter(c=>Number(c.limiteDisponivel)<0); if(neg.length){ score-=15; motivos.push(`${neg.length} cartão(ões) acima do limite`); }
  if(r.renda>0){ const comp=(r.totalContasMes)/r.renda; if(comp>.7){score-=25;motivos.push(`contas comprometem ${Math.round(comp*100)}% da renda`);} else if(comp>.5){score-=12;motivos.push(`contas comprometem ${Math.round(comp*100)}% da renda`);} }
  else { score-=10; motivos.push("renda mensal não informada"); }
  if(!(Number(S.config.reserva)>0)){ score-=10; motivos.push("sem reserva de emergência"); }
  if(r.livre<0){ score-=10; motivos.push("mês fecha no negativo"); }
  score=Math.max(0,Math.min(100,score));
  const nivel = score>=75?{t:"Saudável",c:"ok"}: score>=50?{t:"Atenção",c:"warn"}:{t:"Crítico",c:"bad"};
  return {score, motivos, nivel};
}

async function pagarConta(c, valorPago, dataPag, silencioso){
  const ret={};
  const pago = {...c, status:"paga", pagoEm:dataPag, valorPago:round2(valorPago)};
  await salvar("contas", pago);
  ret.lancId=uid();
  await salvar("lancamentos", { id:ret.lancId, tipo:"despesa", descricao:c.nome + (c.parcelaTotal?` (${c.parcelaAtual}/${c.parcelaTotal})`:""), valor:round2(valorPago), data:dataPag, categoria:c.categoria, metodo:c.metodo||"", contaId:c.id });
  // gera a próxima ocorrência
  const temParcela = Number(c.parcelaTotal)>0;
  if(c.recorrencia==="mensal" && (!temParcela || Number(c.parcelaAtual)<Number(c.parcelaTotal))){
    const jaExiste = S.contas.some(x=>x.serie && x.serie===(c.serie||c.id) && ym(x.vencimento)===ym(addMonths(c.vencimento,1)));
    if(!jaExiste){
      const prox = {...c, id:uid(), serie:c.serie||c.id, vencimento:addMonths(c.vencimento,1), status:"aberta", pagoEm:null, valorPago:null};
      if(temParcela) prox.parcelaAtual = Number(c.parcelaAtual)+1;
      ret.proxId=prox.id;
      await salvar("contas", prox);
    }
  }
  if(!silencioso) toast("Conta paga e lançada no extrato");
  return ret;
}
async function desfazerPagamento(c){
  await salvar("contas", {...c, status:"aberta", pagoEm:null, valorPago:null});
  const l = S.lancamentos.find(x=>x.contaId===c.id);
  if(l) await remover("lancamentos", l.id);
  toast("Pagamento desfeito");
}

// Saldo em conta = valor informado pelo usuário + entradas − saídas lançadas depois disso.
function saldoAtual(){
  const em = S.config.saldoEm; const base = Number(S.config.saldoConta);
  if(!em || !Number.isFinite(base)) return null;
  const dia = String(em).slice(0,10);
  let v = base;
  for(const l of S.lancamentos){
    const depois = l.criadoEm ? l.criadoEm > em : l.data > dia;
    if(depois) v += (l.tipo==="receita"?1:-1) * (Number(l.valor)||0);
  }
  return round2(v);
}

  el.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>{ inp.value=b.dataset.sug; grow(); inp.focus(); });

function renderAILog(){
  const out=$("#aiOut"); if(!out) return;
  out.innerHTML = AI.log.slice(-4).map(m=>{
    if(m.role==="user") return `<div class="ai-msg user fade-in">${esc(m.text)}</div>`;
    const acts = (m.acoes||[]).map(a=>`<div class="ai-act"><span class="k ${a.tipo}">${NOME_ACAO[a.tipo]}</span><span class="v">${a.tipo==="receita"?"+":""}${brl(a.valor)}</span><span class="d">${esc(a.descricao||a.nome||"")}</span><span class="m">${esc([a.categoria, a.metodo, a.tipo==="conta"?"vence "+fmtDfull(a.vencimento):fmtDfull(a.data), a.recorrencia==="mensal"&&!a.parcelaTotal?"todo mês":"", a.parcelaTotal?`${a.parcelaAtual||1}/${a.parcelaTotal}`:""].filter(Boolean).join(" · "))}</span></div>`).join("");
    const idx = AI.log.indexOf(m);
    const rodape = m.status==="salvo" ? `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="pill ok">Salvo</span><button class="btn sm ghost" data-undo="${idx}">Desfazer</button></div>`
      : m.status==="desfeito" ? `<span class="pill">Desfeito</span>` : "";
    return `<div class="ai-msg fade-in"><span class="who">Assistente</span>${m.thinking?`<span class="thinking" aria-label="Pensando"><i></i><i></i><i></i></span>`:""}${m.text?`<div>${esc(m.text)}</div>`:""}${acts}${rodape}</div>`;
  }).join("");
  out.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>desfazerIA(AI.log[Number(b.dataset.undo)]));
}
async function aiEnviar(texto){
  AI.log.push({role:"user", text:texto});
  const msg={role:"assistant", text:"", thinking:true}; AI.log.push(msg); AI.busy=true; renderAILog();
  try{
    const r = await api("POST","/api/ia/mensagem",{texto});
    msg.text = String(r.resposta||"");
    if(Array.isArray(r.acoes) && r.acoes.length){ msg.acoes=r.acoes; msg.feitos=r.feitos; msg.status="salvo"; await recarregar(); }
  }catch(e){ msg.text = e.message; }
  finally{ AI.busy=false; msg.thinking=false; renderAILog(); }
}
async function desfazerIA(m){
  if(!m||m.status!=="salvo") return;
  try{ await api("POST","/api/ia/desfazer",{feitos:m.feitos||[]}); m.status="desfeito"; renderAILog(); await recarregar(); toast("Desfeito"); }

function simularDividas(dividas, extra, metodo){
  let ds = dividas.map(d=>({nome:d.nome, saldo:Number(d.saldo)||0, j:(Number(d.jurosMes)||0)/100, min:Number(d.parcela)||0})).filter(d=>d.saldo>0);
  if(!ds.length) return {meses:0, juros:0, ordem:[]};
  const ordem=[]; let mes=0, juros=0; const orcamento = ds.reduce((a,d)=>a+d.min,0)+Number(extra||0);
  while(ds.some(d=>d.saldo>0.005) && mes<600){
    mes++;
    ds.forEach(d=>{ if(d.saldo>0){ const ji=d.saldo*d.j; d.saldo+=ji; juros+=ji; } });
    let disp=orcamento;
    const ativos = ds.filter(d=>d.saldo>0.005);
    ativos.forEach(d=>{ const p=Math.min(d.min,d.saldo,disp); d.saldo-=p; disp-=p; });
    const alvo = ds.filter(d=>d.saldo>0.005).sort((a,b)=> metodo==="avalanche" ? (b.j-a.j)||(a.saldo-b.saldo) : (a.saldo-b.saldo));
    for(const d of alvo){ if(disp<=0) break; const p=Math.min(disp,d.saldo); d.saldo-=p; disp-=p; }
    ds.forEach(d=>{ if(d.saldo<=0.005 && !ordem.find(o=>o.nome===d.nome)){ d.saldo=0; ordem.push({nome:d.nome, mes}); } });
  }
  return {meses:mes, juros:round2(juros), ordem, travou: mes>=600};
}

function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function chartDefaults(){ Chart.defaults.font.family=cssv("--font-body"); Chart.defaults.color=cssv("--muted"); Chart.defaults.borderColor=cssv("--line"); }
function donut(id, map){
  const el=document.getElementById(id); if(!el||!window.Chart) return; chartDefaults();
  const e=Object.entries(map).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  charts.push(new Chart(el,{type:"doughnut",data:{labels:e.map(x=>x[0]),datasets:[{data:e.map(x=>round2(x[1])),backgroundColor:e.map(x=>corCat(x[0])),borderColor:cssv("--surface"),borderWidth:2}]},
    options:{maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"right",labels:{boxWidth:10,boxHeight:10}},tooltip:{callbacks:{label:c=>`${c.label}: ${brl(c.parsed)}`}}}}}));
}
function drawCharts(r){

    const res=resumoMes(mesRef); const m={}; [...res.contas, ...(mesRef===iso(today()).slice(0,7)?res.atrasadasAnteriores:[])].forEach(c=>{m[c.categoria]=(m[c.categoria]||0)+Number(c.status==="paga"?(c.valorPago??c.valor):c.valor);});
    donut("chCat", gastoCategoria(mesRef));
    const el=document.getElementById("chFluxo"); if(el&&window.Chart){ chartDefaults();
      const ms=[]; for(let i=5;i>=0;i--){ const d=parseD(mesRef+"-01"); d.setMonth(d.getMonth()-i); ms.push(iso(d).slice(0,7)); }
      charts.push(new Chart(el,{type:"bar",data:{labels:ms.map(monthName),datasets:[
        {label:"Entradas",data:ms.map(x=>soma(lancDoMes(x).filter(l=>l.tipo==="receita"))),backgroundColor:cssv("--ok"),borderRadius:4},
        {label:"Saídas + contas abertas",data:ms.map(x=>round2(soma(lancDoMes(x).filter(l=>l.tipo==="despesa"))+soma(contasDoMes(x).filter(c=>c.status!=="paga")))),backgroundColor:cssv("--accent"),borderRadius:4}]},
        options:{maintainAspectRatio:false,scales:{x:{grid:{display:false}},y:{beginAtZero:true,ticks:{callback:v=>brl(v).replace(",00","")}}},plugins:{legend:{position:"bottom",labels:{boxWidth:10}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${brl(c.parsed.y)}`}}}}}));

    <label class="f full"><span>Nome</span><input name="nome" required value="${esc(c.nome)}" placeholder="Ex.: Conta de luz"></label>
    <label class="f"><span>Valor</span><input name="valor" type="number" step="0.01" inputmode="decimal" required value="${c.valor}"></label>
    <label class="f"><span>Vencimento</span><input name="vencimento" type="date" required value="${c.vencimento}"></label>
    <label class="f"><span>Categoria</span><select name="categoria">${opts(CATEGORIAS,c.categoria)}</select></label>
    <label class="f"><span>Forma de pagamento</span><select name="metodo">${opts(["Boleto","Pix","Débito automático","Cartão de crédito","Débito","Dinheiro","Transferência"],c.metodo)}</select></label>
    <label class="f"><span>Repetição</span><select name="recorrencia"><option value="nenhuma" ${c.recorrencia!=="mensal"?"selected":""}>Só esta vez</option><option value="mensal" ${c.recorrencia==="mensal"?"selected":""}>Todo mês</option></select></label>
    <label class="f"><span>Cartão (se for fatura)</span><select name="cartaoId"><option value="">—</option>${S.cartoes.map(k=>`<option value="${k.id}" ${k.id===c.cartaoId?"selected":""}>${esc(k.nome)}</option>`).join("")}</select></label>
    <label class="f"><span>Parcela atual</span><input name="parcelaAtual" type="number" min="1" value="${c.parcelaAtual||""}" placeholder="Ex.: 1"></label>
    <label class="f"><span>Total de parcelas</span><input name="parcelaTotal" type="number" min="1" value="${c.parcelaTotal||""}" placeholder="Ex.: 6"></label>
    <label class="chk full"><input type="checkbox" name="debitoAuto" ${c.debitoAuto?"checked":""}> Débito automático (deixe saldo na conta)</label>
    <label class="f full"><span>Observação</span><textarea name="obs" rows="2">${esc(c.obs||"")}</textarea></label>
    <div class="dlg-actions full">${n?"":delBtn()}${!n&&c.status==="paga"?`<button type="button" class="btn" id="btnUndo">Desfazer pagamento</button>`:""}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`,
    async fd=>{ const o={...c, id:c.id||uid(), nome:fd.nome.trim(), valor:num(fd.valor), vencimento:fd.vencimento, categoria:fd.categoria, metodo:fd.metodo, recorrencia:fd.recorrencia, cartaoId:fd.cartaoId||"", parcelaAtual:fd.parcelaAtual?Number(fd.parcelaAtual):null, parcelaTotal:fd.parcelaTotal?Number(fd.parcelaTotal):null, debitoAuto:!!fd.debitoAuto, obs:fd.obs, status:c.status||"aberta"};
      if(o.parcelaTotal && o.recorrencia!=="mensal") o.recorrencia="mensal";
      await salvar("contas", o); toast("Conta salva"); });
  const del=$("#btnDel"); if(del) del.onclick=()=>confirmar(`Excluir "${c.nome}"?`, ()=>remover("contas",c.id));
  const und=$("#btnUndo"); if(und) und.onclick=async()=>{ fechar(); await desfazerPagamento(c); };
}
function dlgLanc(l){
  const n=!l.id; l={descricao:"",valor:"",data:iso(today()),categoria:l.tipo==="receita"?"Salário":"Alimentação",metodo:"Pix",obs:"",...l};
  const cats = l.tipo==="receita"?CAT_REC:CATEGORIAS;
  abrir(`<form class="form"><h2 class="full">${n?(l.tipo==="receita"?"Nova entrada":"Novo gasto"):"Editar lançamento"}</h2>
    <label class="f full"><span>Descrição</span><input name="descricao" required value="${esc(l.descricao)}" placeholder="${l.tipo==="receita"?"Ex.: Salário":"Ex.: Mercado"}"></label>
    <label class="f"><span>Valor</span><input name="valor" type="number" step="0.01" inputmode="decimal" required value="${l.valor}"></label>
    <label class="f"><span>Data</span><input name="data" type="date" required value="${l.data}"></label>
    <label class="f"><span>Categoria</span><select name="categoria">${opts(cats,l.categoria)}</select></label>
    <label class="f"><span>Forma</span><select name="metodo">${opts(["Pix","Débito","Cartão de crédito","Dinheiro","Boleto","Transferência"],l.metodo)}</select></label>
    <label class="f full"><span>Observação</span><textarea name="obs" rows="2">${esc(l.obs||"")}</textarea></label>
    <div class="dlg-actions full">${n?"":delBtn()}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`,
    async fd=>{ await salvar("lancamentos",{...l, id:l.id||uid(), descricao:fd.descricao.trim(), valor:num(fd.valor), data:fd.data, categoria:fd.categoria, metodo:fd.metodo, obs:fd.obs}); toast("Lançamento salvo"); });
  const del=$("#btnDel"); if(del) del.onclick=()=>confirmar(`Excluir "${l.descricao}"?`, ()=>remover("lancamentos",l.id));
}
function dlgMeta(m){
  const n=!m; m=m||{nome:"",alvo:"",atual:0,aporteMensal:"",prazo:""};
  abrir(`<form class="form"><h2 class="full">${n?"Nova meta":"Editar meta"}</h2>
    <label class="f full"><span>Nome</span><input name="nome" required value="${esc(m.nome)}" placeholder="Ex.: Reserva de emergência"></label>
    <label class="f"><span>Valor alvo</span><input name="alvo" type="number" step="0.01" required value="${m.alvo}"></label>
    <label class="f"><span>Já guardado</span><input name="atual" type="number" step="0.01" value="${m.atual}"></label>
    <label class="f"><span>Guardar por mês</span><input name="aporteMensal" type="number" step="0.01" value="${m.aporteMensal}"></label>
    <label class="f"><span>Prazo</span><input name="prazo" type="date" value="${m.prazo||""}"></label>
    <div class="dlg-actions full">${n?"":delBtn()}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`,
    async fd=>{ await salvar("metas",{...m,id:m.id||uid(),nome:fd.nome.trim(),alvo:num(fd.alvo),atual:num(fd.atual),aporteMensal:num(fd.aporteMensal),prazo:fd.prazo}); toast("Meta salva"); });
  const del=$("#btnDel"); if(del) del.onclick=()=>confirmar(`Excluir meta "${m.nome}"?`, ()=>remover("metas",m.id));
}
function dlgDivida(d){
  const n=!d; d=d||{nome:"",saldo:"",jurosMes:"",parcela:""};
  abrir(`<form class="form"><h2 class="full">${n?"Nova dívida":"Editar dívida"}</h2>
    <label class="f full"><span>Nome</span><input name="nome" required value="${esc(d.nome)}"></label>
    <label class="f"><span>Saldo devedor</span><input name="saldo" type="number" step="0.01" required value="${d.saldo}"></label>
    <label class="f"><span>Parcela mínima/mês</span><input name="parcela" type="number" step="0.01" required value="${d.parcela}"></label>
    <label class="f full"><span>Juros ao mês (%) — veja no contrato ou no app do banco</span><input name="jurosMes" type="number" step="0.01" value="${d.jurosMes}"></label>
    <div class="dlg-actions full">${n?"":delBtn()}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`,
    async fd=>{ await salvar("dividas",{...d,id:d.id||uid(),nome:fd.nome.trim(),saldo:num(fd.saldo),parcela:num(fd.parcela),jurosMes:num(fd.jurosMes)}); toast("Dívida salva"); });
  const del=$("#btnDel"); if(del) del.onclick=()=>confirmar(`Excluir "${d.nome}"?`, ()=>remover("dividas",d.id));
}
function dlgCartao(c){
  const n=!c; c=c||{nome:"",limiteDisponivel:"",fechamento:"",vencimento:"",cor:"#1f4fd1",debitoAuto:false};
  abrir(`<form class="form"><h2 class="full">${n?"Novo cartão":"Editar cartão"}</h2>
    <label class="f full"><span>Nome</span><input name="nome" required value="${esc(c.nome)}"></label>
    <label class="f"><span>Limite disponível</span><input name="limiteDisponivel" type="number" step="0.01" value="${c.limiteDisponivel}"></label>
    <label class="f"><span>Cor</span><input name="cor" type="color" value="${esc(c.cor||"#1f4fd1")}"></label>
    <label class="f"><span>Dia de fechamento</span><input name="fechamento" type="number" min="1" max="31" value="${c.fechamento}"></label>
    <label class="f"><span>Dia de vencimento</span><input name="vencimento" type="number" min="1" max="31" value="${c.vencimento}"></label>
    <label class="chk full"><input type="checkbox" name="debitoAuto" ${c.debitoAuto?"checked":""}> Débito automático da fatura</label>
    <div class="dlg-actions full">${n?"":delBtn()}<button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`,
    async fd=>{ await salvar("cartoes",{...c,id:c.id||uid(),nome:fd.nome.trim(),limiteDisponivel:num(fd.limiteDisponivel),fechamento:fd.fechamento,vencimento:fd.vencimento,cor:fd.cor,debitoAuto:!!fd.debitoAuto}); toast("Cartão salvo"); });
  const del=$("#btnDel"); if(del) del.onclick=()=>confirmar(`Excluir "${c.nome}"?`, ()=>remover("cartoes",c.id));
}
function dlgValor(titulo, atual, fn){
  abrir(`<form class="form"><h2 class="full">${esc(titulo)}</h2><label class="f full"><span>Valor (R$)</span><input name="v" type="number" step="0.01" inputmode="decimal" required value="${atual||""}"></label>
  <div class="dlg-actions full"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`, async fd=>fn(num(fd.v)));
}
function dlgLimite(cat){
  const orc=S.config.orcamentos||{};
  abrir(`<form class="form"><h2 class="full">Limite mensal por categoria</h2>
  <label class="f"><span>Categoria</span><select name="cat">${opts(CATEGORIAS,cat||CATEGORIAS[0])}</select></label>
  <label class="f"><span>Limite (0 remove)</span><input name="v" type="number" step="0.01" inputmode="decimal" value="${cat&&orc[cat]?orc[cat]:""}"></label>
  <div class="dlg-actions full"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`,
  async fd=>{ const o={...orc}; const v=num(fd.v); if(v>0) o[fd.cat]=v; else delete o[fd.cat]; await salvarConfig({orcamentos:o}); });
}

/* ===================== exportação ===================== */
function csvMes(k){
  const linhas=[["tipo","data","descricao","categoria","valor","status"]];
  lancDoMes(k).forEach(l=>linhas.push([l.tipo,l.data,l.descricao,l.categoria,String(l.valor).replace(".",","),"lançado"]));
  contasDoMes(k).filter(c=>c.status!=="paga").forEach(c=>linhas.push(["conta",c.vencimento,c.nome,c.categoria,String(c.valor).replace(".",","),"em aberto"]));
  return linhas.map(r=>r.map(x=>`"${String(x??"").replace(/"/g,'""')}"`).join(";")).join("\n");
}
async function copiar(txt, msg){ try{ await navigator.clipboard.writeText(txt); toast(msg); }catch(e){ abrir(`<h2>Copie o conteúdo</h2><textarea style="width:100%;height:220px" readonly>${esc(txt)}</textarea><div class="dlg-actions"><button class="btn" data-close>Fechar</button></div>`); } }
function baixar(nome, txt){
  try{ const url=URL.createObjectURL(new Blob([txt],{type:"application/json"})); const a=document.createElement("a"); a.href=url; a.download=nome; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); }
  catch(e){ copiar(txt, "Backup copiado"); }
}
async function enviarBackup(j){
  if(!j||!Array.isArray(j.contas)) throw new Error("Backup inválido. Use um backup exportado pelo Caixa Vini.");
  const r = await api("POST","/api/importar",{backup:j});
  await recarregar(); toast(`Backup importado: ${r.registros} registros`);
}
async function importar(file){
  if(!file) return;
  try{ await enviarBackup(JSON.parse(await file.text())); }
  catch(e){ toast(e instanceof SyntaxError ? "Arquivo inválido. Use um backup exportado pelo Caixa Vini." : e.message); }
}
function dlgColarBackup(){
  abrir(`<form class="form"><h2 class="full">Colar backup</h2>
    <label class="f full"><span>Conteúdo do backup (JSON)</span><textarea name="txt" rows="8" required placeholder='{"contas":[...]}'></textarea></label>
    <p class="full muted" style="margin:0;font-size:13px">Registros com o mesmo id são atualizados; nada é apagado.</p>
    <div class="dlg-actions full"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Importar</button></div></form>`,
    async fd=>{ let j; try{ j=JSON.parse(fd.txt); }catch(e){ toast("Texto inválido: cole o backup inteiro."); throw e; } try{ await enviarBackup(j); }catch(e){ toast(e.message); throw e; } });
}
function dlgNumeroRobo(){
  abrir(`<form class="form"><h2 class="full">Número do robô</h2>
    <label class="f full"><span>Número com DDI e DDD (o número de teste da Meta)</span><input name="n" inputmode="tel" value="${esc(S.config.numeroRobo||"")}" placeholder="+1 555 123 4567"></label>
    <div class="dlg-actions full"><button type="button" class="btn" data-close>Cancelar</button><button class="btn pri" type="submit">Salvar</button></div></form>`,
    async fd=>salvarConfig({numeroRobo:String(fd.n||"").trim()}));
}

/* ===================== geral ===================== */
let tT; function toast(m){ document.querySelectorAll(".toast").forEach(x=>x.remove()); const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=m; document.body.appendChild(t); clearTimeout(tT); tT=setTimeout(()=>t.remove(),2600); }
$("#mPrev").onclick=()=>{ const d=parseD(mesRef+"-01"); d.setMonth(d.getMonth()-1); mesRef=iso(d).slice(0,7); render(); };
$("#mNext").onclick=()=>{ const d=parseD(mesRef+"-01"); d.setMonth(d.getMonth()+1); mesRef=iso(d).slice(0,7); render(); };
$("#olhoBtn").onclick=()=>{ ui.ocultar=!ui.ocultar; try{ localStorage.setItem("cv-ocultar", ui.ocultar?"1":"0"); }catch(e){} render(); renderAILog(); };
$("#fab").onclick=()=>{ const r=rota(); if(r==="contas") return dlgConta(); if(r==="planejar") return ui.planTab==="metas"?dlgMeta():ui.planTab==="dividas"?dlgDivida():dlgLimite(""); if(r==="mais"&&ui.maisTab==="cartoes") return dlgCartao(); dlgLanc({tipo:"despesa"}); };
render();
iniciar();
</script>
</body>
</html>
