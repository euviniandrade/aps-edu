# Caixa Vini — app pessoal (separado do backend do SOFI)
# Troque o nome do app se "caixa-vini" já estiver em uso no Fly.io.
app = "caixa-vini"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "3000"
  DB_FILE = "/data/caixa.db"

[http_service]
  internal_port = 3000
  force_https = true
  # Liga sozinho quando chega mensagem do WhatsApp ou você abre o app; desliga quando fica parado.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/saude"
  timeout = "5s"

[[mounts]]
  source = "caixa_vini_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
